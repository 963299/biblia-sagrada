<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bíblia Sagrada</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#07040f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#14213d;--mut:#5b6478;--gold:#a87b10;--wine:#7a1f2b;--line:#dcd8cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16213a;--ink:#eef0f6;--mut:#a3adc4;--gold:#e0b84a;--wine:#e58a95;--line:#2a3757}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16213a;--ink:#eef0f6;--mut:#a3adc4;--gold:#e0b84a;--wine:#e58a95;--line:#2a3757}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
main{max-width:640px;margin:0 auto;padding:18px 16px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25;margin:0 0 12px}
h1{font-size:28px}h2{font-size:22px}
p{margin:0 0 12px;font-family:Georgia,serif}
a{color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.pao{display:block;width:100%;padding:30px 16px;border:2px solid var(--gold);border-radius:18px;background:var(--card);color:var(--ink);font:700 26px Georgia,serif;cursor:pointer}
.pao:focus-visible,.nav a:focus-visible,.item:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.verso{margin-top:14px;border-left:4px solid var(--gold);padding:6px 14px;font-size:20px}
.ref{color:var(--gold);font:600 15px system-ui,sans-serif}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin:8px 8px 0 0}
.item{display:block;padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.grid a{text-align:center;padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none}
.mut{color:var(--mut);font-size:14px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1;text-align:center;padding:10px 2px;font-size:12px;text-decoration:none;color:var(--mut)}
.nav a.on{color:var(--gold);font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs a{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;text-decoration:none}
.tabs a.on{background:var(--gold);color:#fff;border-color:var(--gold)}
html:root:root:root{--bg:#07040f;--card:#120a22;--ink:#f4f0ff;--mut:#b4a8d6;--gold:#00f0ff;--wine:#ff2bd6;--line:#3a1f66}
.pao{box-shadow:0 0 18px #00f0ff88,inset 0 0 14px #00f0ff44;text-shadow:0 0 10px #00f0ff}
.verso{border-left-color:#ff2bd6;box-shadow:-6px 0 14px -6px #ff2bd6}
h1,h2{text-shadow:0 0 12px #ff2bd677}
.nav{box-shadow:0 -2px 14px #00f0ff33}
.nav a.on{text-shadow:0 0 8px #00f0ff}
.tabs a.on{color:#07040f}
.btn:hover{box-shadow:0 0 10px #39ff14;border-color:#39ff14}
.item b{color:#39ff14}
.arv{text-decoration:none;font-size:18px}
.tr{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0 14px}
.nd{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.nd.me{border-color:#ff2bd6;box-shadow:0 0 12px #ff2bd6;font-weight:700}
a.nd{border-color:#39ff14}
.ln{text-align:center;margin:0}
.vn{display:inline-flex;align-items:center;gap:3px;font:700 15px system-ui,sans-serif;color:var(--gold);margin-right:8px;white-space:nowrap}
.arv{font-size:20px;line-height:1}
.arvg{display:grid;place-items:center;width:48px;height:48px;font-size:26px;line-height:1;text-decoration:none;border:2px solid #39ff14;border-radius:14px;box-shadow:0 0 12px #39ff14aa;margin-left:10px;overflow:hidden}
.arvg img{width:100%;height:100%;object-fit:cover;display:block}
.arvg.ag{border-color:#ff2bd6;box-shadow:0 0 12px #ff2bd6aa}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.acoes .btn{flex:1;min-width:100px;margin:0;padding:14px 8px;font-size:16px}
</style>
</head>

const icones=(l,c)=>{const L=decodeURIComponent(l);return (tem(NOMES,L,c)?`<a class="arvg" href="#/nomes/${l}/${c}" aria-label="Personagens do capítulo"><img src="${IMG_ARV}" alt="Árvore genealógica"></a>`:"")+(tem(LUGARES,L,c)?`<a class="arvg" href="#/lugares/${l}/${c}" aria-label="Mapas do capítulo"><img src="${IMG_MAPA}" alt="Mapas"></a>`:"")+`<a class="arvg ag" href="#/agenda/${l}/${c}" aria-label="Agendar estudo ou releitura">📅</a>`};
const arv=(l,c,n)=>NOMES[`${decodeURIComponent(l)}|${c}|${n}`]?`<a class="arv" href="#/nomes/${l}/${c}/${n}" aria-label="Personagens do versículo">🌳</a> `:"";
const PAO=[["João 3:16","Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna."],["Salmos 23:1","O Senhor é o meu pastor; nada me faltará."],["Filipenses 4:13","Posso todas as coisas em Cristo que me fortalece."],["Atos 1:8","Mas recebereis a virtude do Espírito Santo, que há de descer sobre vós; e ser-me-eis testemunhas."],["Romanos 8:1","Portanto, agora, nenhuma condenação há para os que estão em Cristo Jesus."]];
const ESTUDOS=[
["sangue","O sangue na Bíblia","Um estudo em 6 capítulos, do Gênesis ao Apocalipse",[
["A vida está no sangue",`<p>Em hebraico, sangue é <i>dam</i>. Já em Gênesis 9:4, depois do dilúvio, Deus proíbe comer carne com o seu sangue, porque nele está a vida. Deuteronômio 12:23 repete o princípio.</p><p>Levítico 17:11 explica o motivo: a vida da carne está no sangue, e Deus o deu sobre o altar para fazer expiação. Quem oferecia o sacrifício reconhecia que o pecado custa uma vida.</p><p class="mut">Ideia central: no sangue a Bíblia enxerga vida entregue, e não apenas um líquido.</p>`],
["O sangue que clama",`<p>O primeiro sangue derramado é o de Abel. Em Gênesis 4:10, Deus diz a Caim que a voz do sangue do irmão clama da terra. O sangue inocente pede justiça.</p><p>Hebreus 12:24 compara: o sangue de Cristo fala melhor do que o de Abel. Um pede justiça contra o culpado, o outro traz perdão.</p><p class="mut">Para pensar: por que a Bíblia trata o sangue como algo que "fala"?</p>`],
["A Páscoa: o sangue nas portas",`<p>Em Êxodo 12, cada família israelita sacrifica um cordeiro sem defeito e marca as ombreiras das portas com o seu sangue. Deus promete que, ao ver o sangue, passará por cima daquela casa.</p><p>O livramento não vinha da qualidade da família, e sim do sangue aplicado. A Páscoa vira a base da memória de Israel e, no Novo Testamento, o retrato de Cristo (1 Coríntios 5:7; João 1:29).</p>`],
["O Tabernáculo e o Dia da Expiação",`<p>Levítico 16 descreve o Yom Kippur. Uma vez por ano, o sumo sacerdote entrava no Santo dos Santos com sangue e o aspergia sobre a tampa da arca, o propiciatório.</p><p>Hebreus 9:7 lembra que isso era feito uma vez ao ano e que o sacerdote não entrava sem sangue. O sistema ensinava que o acesso a Deus tem preço e que o pecado precisa ser tratado.</p><p class="mut">Também mostra o limite: os sacrifícios eram repetidos todos os anos (Hebreus 10:1-4).</p>`],
["O sangue de Cristo",`<p>O Novo Testamento liga o sangue de Cristo a vários resultados: redenção e perdão (Efésios 1:7), justificação (Romanos 5:9), purificação (1 João 1:7) e acesso a Deus (Hebreus 10:19).</p><p>Hebreus 9:11-14 mostra Cristo entrando uma só vez no santuário celestial, com o seu próprio sangue, e conclui que ele purifica a consciência. Em 1 Pedro 1:18-19, o preço do resgate é o sangue precioso, como de um cordeiro sem defeito.</p>`],
["O sangue hoje: Ceia e vitória",`<p>Na Última Ceia, Jesus chama o cálice de sangue da nova aliança, derramado para perdão de pecados (Mateus 26:28). Paulo orienta a igreja a celebrar a Ceia com reverência (1 Coríntios 11:23-29).</p><p>Apocalipse 12:11 diz que os santos venceram o acusador pelo sangue do Cordeiro e pela palavra do seu testemunho.</p><p class="mut">Fontes para aprofundar: Easton's Bible Dictionary e ISBE (domínio público), a Mishná (tratados Yoma e Zevachim) e comentários de Hebreus.</p>`],
["A aliança selada com sangue",`<p>Em Êxodo 24:3-8, Moisés lê o livro da aliança, o povo promete obedecer, e ele asperge o povo com sangue dizendo que é o sangue da aliança. Na antiguidade, alianças importantes eram seladas com sacrifício.</p><p>Jeremias 31:31-34 anuncia uma nova aliança, e Jesus a declara na Ceia (Lucas 22:20). O sangue marca o momento em que Deus se compromete com o seu povo.</p>`],
["Sangue e consciência",`<p>Hebreus 9:14 diz que o sangue de Cristo purifica a consciência de obras mortas, para servir ao Deus vivo. O alvo vai além do perdão: é uma vida livre da culpa que paralisa.</p><p>Hebreus 10:22 convida a nos aproximarmos de Deus com o coração purificado de má consciência. O mesmo sangue que perdoa também liberta para servir.</p>`]]],
["pos-morte","O que vem após a morte","Seol, Hades, Paraíso, Geena e juízo",[
["Seol e Hades",`<p>No Antigo Testamento, <i>Seol</i> é o lugar para onde vão os mortos (Gênesis 37:35). Em Atos 2:27, Pedro cita o Salmo 16:10 e traduz Seol pelo grego <i>Hades</i>.</p><p>No Novo Testamento, o Hades aparece em Mateus 16:18, Lucas 16:23 e Apocalipse 1:18, onde Cristo diz ter as chaves da morte e do Hades.</p>`],
["O rico e Lázaro, e o Paraíso",`<p>Em Lucas 16:19-31, os dois estão conscientes depois da morte, em lugares separados por um grande abismo. Alguns estudiosos tratam o texto como parábola, mas o ensino sobre consciência e destinos é claro.</p><p>Na cruz, Jesus diz ao ladrão que ele estaria com ele no Paraíso naquele dia (Lucas 23:43). Paulo fala em estar ausente do corpo e presente com o Senhor (2 Coríntios 5:8; Filipenses 1:23).</p>`],
["Geena, juízo e ressurreição",`<p><i>Geena</i> vem do Vale de Hinom, perto de Jerusalém, usado como figura do juízo (Mateus 5:22; 10:28). Em Apocalipse 20:11-15, os mortos são julgados, e a morte e o Hades são lançados no lago de fogo.</p><p>A esperança cristã é a ressurreição (1 Coríntios 15) e o encontro com o Senhor (1 Tessalonicenses 4:16-17). Há visões diferentes entre cristãos sobre a duração do castigo, e a tradição pentecostal clássica sustenta que é eterno.</p>`]]],
["espirito-alma-corpo","Espírito, alma e corpo","Ruach, nefesh, pneuma e psyche",[
["As palavras originais",`<p>Em hebraico, <i>ruach</i> é sopro, vento e espírito, e <i>nefesh</i> é o ser vivo, a vida. Em Gênesis 2:7, Deus sopra no homem e ele se torna <i>nefesh chayah</i>, alma vivente.</p><p>No grego do Novo Testamento, <i>pneuma</i> é espírito, <i>psyche</i> é alma e <i>soma</i> é corpo.</p>`],
["Duas partes ou três?",`<p>1 Tessalonicenses 5:23 pede que o espírito, a alma e o corpo sejam guardados irrepreensíveis, e Hebreus 4:12 fala em dividir alma e espírito. Daí vem a visão tricotômica, comum entre pentecostais.</p><p>Outros textos falam só em duas partes, como alma e corpo (Mateus 10:28) ou carne e espírito (2 Coríntios 7:1). Por isso há debate, e vale mostrar as duas leituras.</p>`],
["A pessoa inteira",`<p>A Bíblia trata o ser humano como uma unidade. O corpo importa: é templo do Espírito Santo (1 Coríntios 6:19), e a esperança final é um corpo ressuscitado (1 Coríntios 15:42-44).</p>`]]],
["batismo-aguas","O batismo nas águas","Origem, significado e perguntas comuns",[
["De onde vem o batismo",`<p>O verbo grego <i>baptizo</i> significa mergulhar. Os judeus já usavam banhos de purificação (<i>mikvê</i>, Levítico 15). João Batista batizava em arrependimento (Marcos 1:4) no rio Jordão.</p>`],
["Jesus e a ordem de batizar",`<p>Jesus foi batizado por João para "cumprir toda a justiça" (Mateus 3:15). Antes de subir ao céu, mandou fazer discípulos e batizá-los (Mateus 28:19).</p><p>Paulo vê no batismo a figura de morrer e ressuscitar com Cristo (Romanos 6:3-4), o que combina com a imersão.</p>`],
["Significado e perguntas",`<p>O batismo é sinal público de fé, e não o que salva (Efésios 2:8-9). O ladrão da cruz foi salvo sem ser batizado (Lucas 23:43). Em Marcos 16:16, vem depois de crer.</p><p>A maioria das igrejas evangélicas batiza quem já professa a fé. Há diferença no modo (imersão ou aspersão) e na fórmula usada.</p>`]]],
["espirito-santo","O batismo no Espírito Santo","Atos 2, 10 e 19 e 1 Coríntios 12 a 14",[
["A promessa",`<p>Joel 2:28-29 profetiza que Deus derramaria o seu Espírito. João Batista diz que Jesus batizaria com o Espírito Santo (Mateus 3:11).</p><p>Em Atos 1:4-8, Jesus manda esperar em Jerusalém a promessa do Pai e diz que receberiam poder para ser testemunhas.</p>`],
["Os relatos em Atos",`<p>O derramar do Espírito aparece em Atos 2 (Pentecostes), 8:14-17 (Samaria), 10:44-46 (casa de Cornélio) e 19:1-6 (Éfeso). Línguas são citadas em Atos 2, 10 e 19. Em Atos 8 o texto não diz.</p>`],
["Duas leituras",`<p>A doutrina pentecostal clássica ensina que o batismo no Espírito Santo é uma experiência separada da conversão, com as línguas como sinal inicial.</p><p>Muitas igrejas evangélicas leem 1 Coríntios 12:13 como indicando que todo crente é batizado no Espírito ao se converter. É útil o app mostrar as duas leituras.</p>`],
["Dons e fruto",`<p>Os dons do Espírito estão em 1 Coríntios 12 a 14, e o fruto do Espírito em Gálatas 5:22-23. Paulo pede que tudo seja feito para edificação e com ordem (1 Coríntios 14:12, 40).</p>`]]],
["pascoa","Páscoa e Yom Kippur","A expiação no Templo",null],
["fariseus","Fariseus, saduceus e essênios","Os grupos do Segundo Templo",null],
["cura-saliva","Jesus, a saliva e a cura dos cegos","Marcos 8 e João 9 no contexto antigo",[
["Terra e saliva: o que as fontes dizem",`<p>Em Marcos 8:23 e João 9:6, Jesus usa saliva e, em João, barro. Circula a ideia de que era costume cuspir em quem passava perto de um cego, mas não conheço fonte antiga séria que confirme isso.</p><p>O que as fontes mostram é outra coisa: a saliva era remédio popular para os olhos. Tácito (Histórias 4.81) e Suetônio (Vespasiano 7) contam que Vespasiano curou um cego com saliva, e Plínio, o Velho, a cita em receitas (História Natural 28.7).</p><p class="mut">Ideia central: Jesus usou um gesto que o povo reconhecia, e a cura veio do seu poder.</p>`],
["O sábado e o barro",`<p>João 9:14 diz que era sábado. Amassar barro era um trabalho proibido, já que a Mishná (Shabbat 7:2) inclui "amassar" entre as 39 categorias de trabalho. Os tratados rabínicos também discutem o uso de colírios e saliva nos olhos no sábado.</p><p>Jesus agiu de modo que provocou a discussão com os fariseus, e o cego curado passa a testemunhar (João 9:25).</p>`],
["Siloé e o cego de Jericó",`<p>Jesus manda o homem lavar-se no tanque de Siloé, nome que João traduz como "enviado" (João 9:7). Ele precisou obedecer e ir para ser curado.</p><p>Já o cego Bartimeu foi curado só pela palavra (Marcos 10:52). Jesus não tinha um método fixo, e cada encontro era único.</p>`]]],
["toque-morto","Jesus toca o morto","Naim, a filha de Jairo e a lei da impureza",[
["A lei da impureza",`<p>Números 19:11-16 diz que quem tocasse um corpo morto ficava impuro por sete dias. Sacerdotes só podiam se contaminar por parentes próximos (Levítico 21:1-3), e o nazireu nunca (Números 6:6).</p><p>Na prática, tocar um morto afastava a pessoa do convívio e do culto. Por isso o gesto de Jesus era chocante.</p>`],
["Naim: Jesus toca o esquife",`<p>Em Lucas 7:11-17, Jesus encontra um funeral na cidade de Naim: o morto era o filho único de uma viúva. Um jovem, e não uma criança. Jesus teve compaixão da mãe e <b>tocou o esquife</b>, a maca em que o corpo era levado.</p><p>Quem carregava parou. Jesus podia ter falado de longe, mas tocou. Em seguida, ordenou que o jovem se levantasse.</p><p class="mut">Pense: a impureza que deveria passar do morto para ele não passou. A vida passou dele para o morto.</p>`],
["A filha de Jairo",`<p>Em Marcos 5:35-43, Jesus entra onde a menina de 12 anos estava morta e a toma pela mão, dizendo <i>Talita cumi</i>, expressão aramaica que significa "menina, levanta-te".</p><p>No mesmo capítulo, uma mulher com hemorragia, considerada impura (Levítico 15:25), toca nele. Em vez de ficar impuro, Jesus a cura. Nos Evangelhos, a pureza de Cristo vence a impureza.</p>`]]]];
const DICIO=[["Hades","Palavra grega para o lugar dos mortos. Aparece em Mateus 16:18, Lucas 16:23 e Apocalipse 20:13-14. Equivale ao hebraico Seol."],["Seol","Termo hebraico para a sepultura ou o lugar dos mortos no Antigo Testamento."],["Alma","Do hebraico nefesh e do grego psyche: a vida, o ser vivo, a pessoa."],["Espírito","Do hebraico ruach e do grego pneuma: sopro, vento, o Espírito de Deus."],["Pentecostes","Festa judaica 50 dias após a Páscoa. Em Atos 2, o dia em que o Espírito Santo foi derramado."],["Expiação","Ato que cobre o pecado e restaura a comunhão com Deus (Levítico 16)."],["Labão","Irmão de Rebeca e sogro de Jacó, de Padã-Arã. Enganou Jacó dando-lhe Lia no lugar de Raquel e o fez trabalhar cerca de 20 anos (Gênesis 29 a 31)."],["Abraão","Chamado por Deus para deixar Ur e ir a Canaã (Gênesis 12). Pai de Isaque e exemplo de fé (Romanos 4)."],["Moisés","Líder que tirou Israel do Egito e recebeu a Lei no Sinai. Criado na casa de Faraó (Êxodo 2 a 20)."],["Davi","Pastor de Belém que derrotou Golias e se tornou rei de Israel. Autor de muitos Salmos (1 Samuel 16 a 1 Reis 2)."],["Jacó","Filho de Isaque, recebeu o nome Israel. Seus 12 filhos deram origem às tribos de Israel (Gênesis 25 a 50)."],["Siloé","Tanque de Jerusalém onde o cego de nascença se lavou (João 9:7). O nome significa enviado."],["Propiciatório","Tampa de ouro da arca da aliança, onde o sumo sacerdote aspergia sangue no Dia da Expiação (Êxodo 25:17-22)."],["Naim","Cidade da Galileia onde Jesus ressuscitou o filho da viúva (Lucas 7:11-17)."]];
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const NAV=[["","Início"],["biblia","Bíblia"],["estudos","Estudos"],["dicionario","Dicionário"],["imagem","Imagem"],["mapa","Mapa"]];

 $("#pao").onclick=()=>{const[r,t]=PAO[paoIdx++%PAO.length];$("#v").innerHTML=`<div class="verso"><div class="ref">${r}</div><p>${t}</p></div><button class="btn" id="outro">Outro versículo</button><button class="btn" id="cp">Compartilhar</button>`;
 $("#outro").onclick=()=>$("#pao").click();
 $("#cp").onclick=()=>{const m=`"${t}" (${r})`;navigator.share?navigator.share({text:m}).catch(()=>{}):window.open("https://wa.me/?text="+encodeURIComponent(m))}}}
function biblia(p){
 const[,t="at",livro,cap]=p;
 if(livro&&cap){const arr=(BIBLIA[decodeURIComponent(livro)]||{})[cap];app.innerHTML=`<p><a href="#/biblia/${t}/${livro}">‹ ${esc(decodeURIComponent(livro))}</a></p><h2 style="display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap">${esc(decodeURIComponent(livro))} ${cap}${icones(livro,cap)}</h2>`+(arr?Object.entries(arr).map(([n,v])=>`<p><span class="vn">${n}</span>${esc(v)}</p>`).join("")+`<p class="mut">Texto de demonstração, só para testar.</p>`:`<div class="card mut">O texto deste capítulo ainda não foi adicionado ao app.</div>`);return}
 if(livro){const b=LIVROS[t].find(x=>x.n===decodeURIComponent(livro));app.innerHTML=`<p><a href="#/biblia/${t}">‹ Livros</a></p><h2>${esc(b.n)}</h2><div class="grid">${Array.from({length:b.c},(_,i)=>`<a href="#/biblia/${t}/${livro}/${i+1}">${i+1}</a>`).join("")}</div>`;return}
 app.innerHTML=`<h2>Bíblia</h2><div class="tabs"><a href="#/biblia/at" class="${t=="at"?"on":""}">Antigo Testamento</a><a href="#/biblia/nt" class="${t=="nt"?"on":""}">Novo Testamento</a></div>`+LIVROS[t].map(b=>`<a class="item" href="#/biblia/${t}/${encodeURIComponent(b.n)}">${b.n}</a>`).join("")}
function livro(e,k){const c=e[3],b=`#/estudos/${e[0]}`,s='style="display:inline-block;text-decoration:none"';
 if(!k){app.innerHTML=`<p><a href="#/estudos">‹ Voltar ao sumário</a></p><h2>${e[1]}</h2><p class="mut">${e[2]}</p>`+c.map((x,i)=>`<a class="item" href="${b}/${i+1}"><b>Capítulo ${i+1}</b><br>${x[0]}</a>`).join("");return}
 const x=c[k-1];app.innerHTML=`<p><a href="${b}">‹ Capítulos</a></p><p class="mut">Capítulo ${k} de ${c.length}</p><h2>${x[0]}</h2>${x[1]}<div>${k>1?`<a class="btn" ${s} href="${b}/${k-1}">‹ Anterior</a>`:""}${k<c.length?`<a class="btn" ${s} href="${b}/${k+1}">Próximo ›</a>`:`<a class="btn" ${s} href="#/estudos">Sumário</a>`}</div>`}
function estudos(p){
 const e=ESTUDOS.find(x=>x[0]===p[1]);
 if(e&&Array.isArray(e[3]))return livro(e,+p[2]||0);
 if(e){const i=ESTUDOS.indexOf(e),n=ESTUDOS[i+1];app.innerHTML=`<p><a href="#/estudos">‹ Voltar ao sumário</a></p><h2>${e[1]}</h2><p class="mut">${e[2]}</p>${e[3]||'<div class="card mut">Este estudo está em preparação.</div>'}${n?`<a class="btn" href="#/estudos/${n[0]}" style="display:inline-block;text-decoration:none">Próximo: ${n[1]}</a>`:""}`;return}
 app.innerHTML=`<h2>Estudos</h2><p class="mut">Sumário. Toque em um título para abrir.</p>`+ESTUDOS.map(x=>`<a class="item" href="#/estudos/${x[0]}"><b>${x[1]}</b><br><span class="mut">${x[2]}</span></a>`).join("")}
function dicionario(){
 app.innerHTML=`<h2>Dicionário bíblico</h2><input id="q" type="search" placeholder="Buscar palavra" aria-label="Buscar palavra"><div id="l"></div>`;
 const f=()=>{const q=$("#q").value.toLowerCase();$("#l").innerHTML=DICIO.filter(d=>d[0].toLowerCase().includes(q)).map(d=>`<div class="card"><h3>${d[0]}</h3><p>${d[1]}</p></div>`).join("")||'<p class="mut">Nenhuma palavra encontrada.</p>'};
 $("#q").oninput=f;f()}
const baixa=b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="versiculo.jpg";a.click()};
function imagem(){
 app.innerHTML=`<h2>Imagem com versículo</h2><p class="mut">1. Escolha o versículo</p><select id="sv" class="btn" style="width:100%">${PAO.map((v,i)=>`<option value="${i}">${v[0]}</option>`).join("")}</select><p class="mut">2. Escolha uma foto da galeria</p><input id="ft" type="file" accept="image/*"><canvas id="cv" style="width:100%;border-radius:12px;display:none"></canvas><div id="ac" style="display:none"><button class="btn" id="env">Enviar por WhatsApp</button><button class="btn" id="bx">Salvar imagem</button></div>`;
 const cv=$("#cv"),cx=cv.getContext("2d");let img=null;
 const desenha=()=>{if(!img)return;const W=1080;cv.width=W;cv.height=W;const s=Math.max(W/img.width,W/img.height);cx.drawImage(img,(W-img.width*s)/2,(W-img.height*s)/2,img.width*s,img.height*s);cx.fillStyle="rgba(0,0,0,.55)";cx.fillRect(0,0,W,W);const[r,t]=PAO[$("#sv").value];cx.fillStyle="#fff";cx.textAlign="center";cx.font="italic 54px Georgia,serif";cx.shadowColor="#00f0ff";cx.shadowBlur=16;
  let ln=[],l="";for(const w of t.split(" ")){if(cx.measureText(l+w).width>900){ln.push(l);l=""}l+=w+" "}ln.push(l);
  const y0=W/2-ln.length*34;ln.forEach((x,i)=>cx.fillText(x.trim(),W/2,y0+i*68));cx.font="bold 44px system-ui";cx.fillStyle="#00f0ff";cx.fillText(r,W/2,y0+ln.length*68+40);cv.style.display="block";$("#ac").style.display="block"};
 $("#ft").onchange=e=>{const f=e.target.files[0];if(!f)return;img=new Image();img.onload=desenha;img.src=URL.createObjectURL(f)};
 $("#sv").onchange=desenha;
 const blob=()=>new Promise(r=>cv.toBlob(r,"image/jpeg",.9));
 $("#env").onclick=async()=>{const b=await blob(),f=new File([b],"versiculo.jpg",{type:"image/jpeg"});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else baixa(b)};
 $("#bx").onclick=async()=>baixa(await blob())}
